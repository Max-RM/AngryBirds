; ============================================================
; AngryBirds settings
; This file must stay next to AngryBirds.exe.
; Lines starting with ";" or "#" are comments.
; ============================================================

[Storage]

; Where the game keeps its saves (settings.lua, highscores.lua, ...):
;
;   0      - %LocalAppData%\AngryBirds
;             (default after compilation; same place the original game used)
;
;   1      - <game folder>\Saves - the Saves folder in the game's root
;             (True Portable: saves stay with the game, so the whole
;              folder can be copied onto a USB stick)
;
;   Custom - saves go to the absolute path given in SavePath below.

SaveLocation=0

; Absolute path to a custom saves folder.
; Used only when SaveLocation=Custom.
; Example:
;SavePath=C:\MyAngryBirdsSaves